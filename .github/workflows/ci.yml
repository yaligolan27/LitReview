name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests (offline, mock backend)
        env:
          SURVEY_LLM_BACKEND: mock
        run: pytest
      - name: Build demo survey artifact (mock E2E)
        if: hashFiles('examples/demo_small.json') != ''
        env:
          SURVEY_LLM_BACKEND: mock
        run: |
          python run_pipeline.py --config examples/demo_small.json --workdir var/ci_demo || true
          ls -la var/ci_demo/outputs/ || true
      - name: Upload demo artifact
        if: hashFiles('var/ci_demo/outputs/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: demo-survey
          path: var/ci_demo/outputs/
