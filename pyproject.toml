[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litreview"
version = "0.1.0"
description = "Academic literature-survey generation system: real sources, verified claims, transparent output"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
exports = [
    "python-docx>=1.1",
]
fuzz = [
    "rapidfuzz>=3.6",
]
pdf = [
    "playwright>=1.44",
]
semantic = [
    "sentence-transformers>=2.6",
]
api = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-docx>=1.1",
]

[project.scripts]
litreview = "litreview.cli:main"

[tool.setuptools.packages.find]
include = ["litreview*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
